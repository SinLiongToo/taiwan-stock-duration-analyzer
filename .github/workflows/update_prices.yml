name: Daily Taiwan Stock Price Auto-Update

on:
  schedule:
    # Runs at 06:00 UTC every weekday (Monday to Friday)
    # 06:00 UTC = 14:00 Taipei Time (UTC+8), 30 minutes after Taiwan market close (13:30)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    paths:
      - 'update_prices.py'
      - '.github/workflows/update_prices.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Latest Taiwan Stock Market Prices
        run: |
          python update_prices.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_market_data.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore(data): auto-update Taiwan stock market dataset [skip ci]"
            git push
          fi
