name: Daily TW & US Stock Price Auto-Update

on:
  schedule:
    # Runs at 06:00 UTC (14:00 Taipei Time, 30m after TW market close)
    - cron: '0 6 * * 1-5'
    # Runs at 21:30 UTC (05:30 Taipei Time, after US market close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    paths:
      - 'update_prices.py'
      - '.github/workflows/update_prices.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Latest TW & US Stock Market Prices
        run: |
          python update_prices.py --inject

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_market_data.json index.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore(data): auto-update TW & US stock market dataset [skip ci]"
            git push
          fi
